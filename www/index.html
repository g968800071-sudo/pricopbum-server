lementById('pbmsg');if(m)m.textContent=t;}window.__pbFail=function(e){if(done)return;msg('Игра не запустилась в этом просмотрщике. Откройте игру по ссылке в Safari или Chrome (не в просмотрщике файлов). Ошибка: '+(e&&e.message?e.message:e));};window.onerror=function(m){window.__pbFail(m);};window.__pbOk=function(){done=true;var b=document.getElementById('pbboot');if(b&&b.parentNode)b.parentNode.removeChild(b);};setTimeout(function(){if(!done)window.__pbFail('таймаут запуска');},8000);})();</script><script src="game.js"></script><script>(function(){try{if(!window.PRICOPBUM)throw new Error('скрипт игры не загрузился (старый браузер?)');window.PRICOPBUM.initPricopbum(document.getElementById('app'));var ok=function(){window.__pbOk()};try{if(window.requestAnimationFrame)requestAnimationFrame(ok)}catch(e){}setTimeout(ok,300);}catch(e){window.__pbFail(e)}})();</script><script>try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}});}catch(e){}</script></body></html>
