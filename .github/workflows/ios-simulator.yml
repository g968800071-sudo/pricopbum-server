# Unsigned iOS Simulator build on a standard GitHub-hosted macOS runner.
# Public repositories: standard runners, including macos-latest, are free.
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners
# This does not sign, archive for a device, or submit to the App Store or TestFlight.
name: iOS simulator unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/pricopbum-playable-3830

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Copy the web bundle into the iOS project
        run: npx cap copy ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build an unsigned simulator app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Record what was built
        run: |
          APP="$GITHUB_WORKSPACE/ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          mkdir -p "$GITHUB_WORKSPACE/ios-report"
          {
            echo "runner=$(sw_vers -productVersion) $(uname -m)"
            xcodebuild -version
            echo "app=$APP"
            file "$APP/App" || true
            codesign -dv "$APP" 2>&1 || true
          } | tee "$GITHUB_WORKSPACE/ios-report/build.txt"

      - name: Boot a simulator and launch the unsigned app
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(raw)
          pick = None
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      pick = d
                      break
              if pick:
                  break
          if not pick:
              raise SystemExit("no available iPhone simulator")
          open("/tmp/sim-udid.txt", "w").write(pick["udid"])
          print(pick["name"], pick["udid"])
          PY
          UDID=$(cat /tmp/sim-udid.txt)
          xcrun simctl boot "$UDID" || true
          # bootstatus can wait forever if the simulator never reports a boot. Cap it.
          perl -e 'alarm 120; exec @ARGV' xcrun simctl bootstatus "$UDID" -b
          APP="$GITHUB_WORKSPACE/ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" studio.pricop.pricopbum | tee "$GITHUB_WORKSPACE/ios-report/launch.txt"
          sleep 3
          xcrun simctl spawn "$UDID" log show --last 20s --predicate 'subsystem CONTAINS "studio.pricop" OR processImagePath CONTAINS "App"' > "$GITHUB_WORKSPACE/ios-report/log.txt" || true
          echo "launched on simulator $UDID" | tee -a "$GITHUB_WORKSPACE/ios-report/launch.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pricopbum-ios-simulator-unsigned
          if-no-files-found: error
          path: |
            ios-derived/Build/Products/Debug-iphonesimulator/App.app
            ios-report
